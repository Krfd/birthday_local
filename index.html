<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" href="assets/img/logo.jpg" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/sweetalert2.min.css" />
    <style>
      body {
        background: linear-gradient(135deg, #e0eafc, #cfdef3);
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <form
      id="login"
      method="post"
      class="shadow p-5 col-10 col-md-6 col-lg-3 rounded-3 bg-white"
    >
      <h1 class="text-center fw-bold">Login</h1>
      <div class="col-12 d-block mx-auto">
        <div class="col-12 col-md-10 mx-auto">
          <label for="username"
            >Username <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control mt-2"
            name="username"
            id="username"
            maxlength="20"
            required
          />
        </div>
        <div class="col-12 col-md-10 mx-auto mt-3">
          <label for="password"
            >Password <span class="text-danger">*</span></label
          >
          <input
            type="password"
            class="form-control mt-2"
            name="password"
            id="password"
            maxlength="20"
            pattern=".*[A-Z].*"
            title="Password must contain at least one uppercase letter"
            required
          />
        </div>
        <div class="col-12 col-md-10 mx-auto mt-2">
          <input type="checkbox" class="form-check-input" id="showPassword" />
          <label for="showPassword">Show Password</label>
        </div>
        <button
          type="submit"
          class="btn btn-primary mt-2 w-auto d-block mx-auto"
        >
          Login
        </button>
      </div>
    </form>
    <script src="js/sweetalert/sweetalert2.all.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>

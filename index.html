<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Raffle</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/sweetalert2.min.css" />
    <style>
      body {
        background:
          linear-gradient(rgba(180, 30, 30, 0.45), rgba(180, 30, 30, 0.45)),
          url("assets/img/newbg.jpg") no-repeat center center / cover;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <form
      id="login"
      method="post"
      class="shadow-sm p-5 col-10 col-md-6 col-lg-3 shadow-lg rounded-4 bg-danger-subtle"
    >
      <h3 class="text-center text-danger-emphasis fw-bold">
        Edward's Birthday Raffle
      </h3>
      <p class="text-center text-dark-emphasis fw-semibold">
        <i>October 10, 2026</i>
      </p>
      <div class="col-12 d-block mx-auto">
        <div class="col-12 mx-auto">
          <label for="username" class="fw-semibold"
            >Username <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control mt-2"
            name="username"
            id="username"
            maxlength="20"
            required
          />
        </div>
        <div class="col-12 mx-auto mt-3">
          <label for="password" class="fw-semibold"
            >Password <span class="text-danger">*</span></label
          >
          <input
            type="password"
            class="form-control mt-2"
            name="password"
            id="password"
            maxlength="20"
            pattern=".*[A-Z].*"
            title="Password must contain at least one uppercase letter"
            required
          />
        </div>
        <div class="col-12 mx-auto mt-2">
          <input type="checkbox" class="form-check-input" id="showPassword" />
          <label for="showPassword">Show Password</label>
        </div>
        <button type="submit" class="btn btn-danger mt-3 w-100 d-block mx-auto">
          Login
        </button>
      </div>
    </form>
    <script src="js/sweetalert/sweetalert2.all.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
